[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "hk-ipo-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pymupdf4llm",
    "pdfplumber",
    "python-dotenv",
    "langextract",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
