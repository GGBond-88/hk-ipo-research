[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-ipo-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11",
    "python-dotenv",
    "langextract>=1.0",
    "openai>=1.40",
    "pandas",
    "matplotlib",
    "langdetect>=1.0.9",
    "portalocker>=2.8",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-p no:anyio"
markers = [
    "e2e: end-to-end black-box test invoking the full pipeline (slow, requires API key).",
]
testpaths = ["tests"]
