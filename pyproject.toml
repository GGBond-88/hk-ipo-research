[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-ipo-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11",
    "python-dotenv",
    "langextract>=1.0",
    "openai>=1.40",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
